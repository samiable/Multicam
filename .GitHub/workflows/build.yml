name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp multicam-studio.html www/index.html
          sed -i 's/const NT=/var NT=/' www/index.html
          sed -i 's#</body>#<script src="qrcode.js"></script><script src="jsQR.js"></script><script src="native.js"></script></body>#' www/index.html
          cp native.js www/
          cp node_modules/qrcode-generator/qrcode.js www/
          cp node_modules/jsqr/dist/jsQR.js www/
      - run: npx cap add android
      - name: Add native code and permissions
        run: |
          D=android/app/src/main/java/com/multicam/studio
          cp MainActivity.java NetPlugin.java $D/
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.WAKE_LOCK"/><application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MultiCam-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
